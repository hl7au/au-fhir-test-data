name: Validate FHIR test data
description: >
  Validate FHIR JSON files under au-fhir-test-data-set with the HL7 FHIR
  validator, using the implementation guides mapped per folder in
  .github/validate/igs.json. Writes a job summary, warning annotations
  and an HTML report artifact. Findings do not fail the step unless
  fail-on-errors is true; infrastructure failures always do.

inputs:
  paths:
    description: >
      Newline-separated files, folders or globs relative to the repo root.
      Only *.json files under au-fhir-test-data-set are validated; missing
      paths are skipped.
    default: au-fhir-test-data-set
  ig:
    description: >
      Optional space-separated validator -ig packages (id#version) applied
      to every folder instead of the igs.json mapping. Leave empty to use
      the mapping.
    default: ""
  tx:
    description: Terminology server
    default: https://tx.dev.hl7.org.au/fhir
  title:
    description: Heading for the job summary and name of the report artifact
    default: FHIR validation
  fail-on-errors:
    description: Fail the step when the validator reports errors
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "25"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Pin validator version
      id: validator
      shell: bash
      run: |
        # Pinned release of hapifhir/org.hl7.fhir.core. Bump the version and
        # the checksum together; the checksum is the release asset digest
        # (gh api repos/hapifhir/org.hl7.fhir.core/releases/tags/<v>).
        {
          echo "version=7.0.6"
          echo "sha256=2686590539f0b3ba7683149b25d78249f6886c04e2c326e884c5049d8947df89"
          echo "dir=$RUNNER_TEMP/fhir-validator"
        } >> "$GITHUB_OUTPUT"

    - name: Restore validator jar
      id: jar-cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.validator.outputs.dir }}
        key: fhir-validator-${{ steps.validator.outputs.version }}

    - name: Download validator jar
      if: steps.jar-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VALIDATOR_VERSION: ${{ steps.validator.outputs.version }}
        VALIDATOR_SHA256: ${{ steps.validator.outputs.sha256 }}
        JAR_DIR: ${{ steps.validator.outputs.dir }}
      run: |
        mkdir -p "$JAR_DIR"
        curl -fsSL --retry 3 -o "$JAR_DIR/validator_cli.jar" \
          "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
        echo "${VALIDATOR_SHA256}  $JAR_DIR/validator_cli.jar" | sha256sum -c -

    - name: Restore FHIR package cache
      uses: actions/cache@v6
      with:
        path: ~/.fhir/packages
        # Packages are pinned, so the mapping file fully determines the cache.
        key: fhir-packages-${{ hashFiles('.github/validate/igs.json') }}
        restore-keys: fhir-packages-

    - name: Run validator
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        IG: ${{ inputs.ig }}
        TX: ${{ inputs.tx }}
        TITLE: ${{ inputs.title }}
        FAIL_ON_ERRORS: ${{ inputs.fail-on-errors }}
        JAR: ${{ steps.validator.outputs.dir }}/validator_cli.jar
        OUT_DIR: ${{ runner.temp }}/fhir-validation-output
      run: |
        args=()
        if [ "$FAIL_ON_ERRORS" = "true" ]; then args+=(--fail-on-errors); fi
        python3 "$GITHUB_ACTION_PATH/fhir_validation.py" \
          --paths-env PATHS \
          --jar "$JAR" \
          --tx "$TX" \
          --ig "$IG" \
          --title "$TITLE" \
          --out-dir "$OUT_DIR" \
          "${args[@]}"

    - name: Upload validation report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.title }} report
        path: ${{ runner.temp }}/fhir-validation-output
        if-no-files-found: ignore
