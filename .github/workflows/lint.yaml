name: Lint

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Test the linter
        working-directory: .github/scripts
        run: |
          pip install pytest==9.2.0
          python -m pytest -q -p no:cacheprovider test_lint_test_data.py

      - name: Lint test data
        run: python .github/scripts/lint_test_data.py
