name: Lint

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A pull request checks out its test merge commit; its first parent
          # (the base branch) is needed to find the problems it introduces.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Test the linter
        working-directory: .github/scripts
        run: |
          pip install pytest==9.2.0
          python -m pytest -q -p no:cacheprovider test_lint_test_data.py

      - name: Lint test data
        # Explicit bash runs with -eo pipefail, so a failing command is never masked.
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Annotate only what the pull request introduces relative to the base branch.
            python .github/scripts/lint_test_data.py --base-ref HEAD^1
          else
            python .github/scripts/lint_test_data.py
          fi
