name: Lint

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A pull request checks out its test merge commit; the parent is
          # needed to list the files the pull request changes.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Test the linter
        working-directory: .github/scripts
        run: |
          pip install pytest==9.2.0
          python -m pytest -q -p no:cacheprovider test_lint_test_data.py

      - name: List files changed by the pull request
        if: github.event_name == 'pull_request'
        # The first parent of the test merge commit is the base branch.
        run: |
          git -c core.quotePath=false diff --name-only --diff-filter=AMR HEAD^1 HEAD \
            | tee "$RUNNER_TEMP/changed-files.txt"

      - name: Lint test data
        run: |
          if [ -f "$RUNNER_TEMP/changed-files.txt" ]; then
            python .github/scripts/lint_test_data.py --changed-files "$RUNNER_TEMP/changed-files.txt"
          else
            python .github/scripts/lint_test_data.py
          fi
